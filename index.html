    <title>Rotating Yin Yang</title>

        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: gray;
        touch-action: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .yin-yang-container {
        width: min(96vw, 96vh);
        height: min(96vw, 96vh);
        animation: rotate 120s linear infinite;
      }

      /*
       * Rotation animation with gradually increasing speed.
       *
       * Speed increases linearly from 0 deg/s at t=0 to 360 deg/s at t=120s.
       * speed(t) = 3t deg/s
       * angle(t) = integral of speed = 1.5 * t^2 degrees
       * At t=120s: angle = 1.5 * 14400 = 21600 deg = 60 full rotations
       *
       * At 360 deg/s the symbol does a full rotation per second,
       * which is visually equivalent to 0 deg/s, so the loop resets.
       *
       * We use 120 keyframe steps (one per second) to approximate
       * the quadratic curve angle(t) = 1.5 * t^2.
       */

          transform: rotate(0deg);
        }

          transform: rotate(1.5deg);
        }

          transform: rotate(6deg);
        }
        2.5% {
          transform: rotate(13.5deg);
        }

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="-1 -1 2 2"
        width="100%"
        height="100%"
      >
        <!-- Black (left) half of outer circle -->
        <path d="M 0 -1 A 1 1 0 0 0 0 1 A 0.5 0.5 0 0 0 0 0 A 0.5 0.5 0 0 1 0 -1" fill="black" />
        <!-- White (right) half of outer circle -->
        <path d="M 0 -1 A 1 1 0 0 1 0 1 A 0.5 0.5 0 0 1 0 0 A 0.5 0.5 0 0 0 0 -1" fill="white" />
        <!-- White dot in black half -->
        <circle cx="0" cy="-0.5" r="0.15" fill="white" />
        <!-- Black dot in white half -->
        <circle cx="0" cy="0.5" r="0.15" fill="black" />
      </svg>
    </div>
    <script>
      // Disable right-click context menu
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });

      // Disable keyboard shortcuts that could trigger zoom or selection
      document.addEventListener('keydown', function (e) {
        // Prevent Ctrl/Cmd + A (select all)
        if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
          e.preventDefault();
        }
        // Prevent Ctrl/Cmd + +/- (zoom)
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=')) {
          e.preventDefault();
        }
      });
    </script>
