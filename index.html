<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Rotating Yin Yang</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #808080;
        touch-action: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .yin-yang-container {
        width: min(96vw, 96vh);
        height: min(96vw, 96vh);
      }

      .yin-yang-container svg {
        display: block;
      }

      /*
       * Rotation animation with gradually increasing speed.
       *
       * Speed increases linearly from 0 deg/frame at t=0s to 360 deg/frame at t=120s.
       * speed(t) = 3t degrees per frame (where t is elapsed seconds)
       *
       * At 360 deg/frame the symbol completes one full rotation every frame,
       * which is visually identical to 0 deg/frame, so the cycle loops seamlessly.
       *
       * Each requestAnimationFrame callback advances the angle by speed(t) degrees.
       * The animation is driven by JavaScript because CSS keyframes cannot express
       * per-frame speed — only per-second timing.
       */
    </style>
  </head>
  <body>
    <div class="yin-yang-container">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="-1 -1 2 2"
        width="100%"
        height="100%"
      >
        <defs>
          <!--
            Mask using the outer circle: only pixels inside r=1 are visible.
            White in the mask = fully visible; the circle is white so everything inside r=1 shows.
            This cleanly clips all content to the circle with proper antialiasing at the edges.
          -->
          <mask id="circle-mask">
            <circle cx="0" cy="0" r="1" fill="white" />
          </mask>
        </defs>
        <!--
          All yin-yang elements are grouped under the mask.
          The mask clips to the circle boundary with correct antialiasing
          (mask edges blend to transparent, not to the gray background).
        -->
        <g mask="url(#circle-mask)">
          <!-- Full black circle as base layer -->
          <circle cx="0" cy="0" r="1" fill="black" />
          <!-- White half: right semicircle + upper lobe - lower lobe.
               Uses large-arc=1 for lobe arcs to ensure full lobe coverage with no gaps.
               Path: top(0,-1) →CW r=1→ bottom(0,1) →large-CCW r=0.5→ center(0,0) →large-CW r=0.5→ top(0,-1)
          -->
          <path
            d="M 0,-1 A 1,1 0 0,1 0,1 A 0.5,0.5 0 1,1 0,0 A 0.5,0.5 0 1,0 0,-1 Z"
            fill="white"
          />
          <!-- Small white dot in black half (upper lobe center) -->
          <circle cx="0" cy="-0.5" r="0.15" fill="white" />
          <!-- Small black dot in white half (lower lobe center) -->
          <circle cx="0" cy="0.5" r="0.15" fill="black" />
        </g>
      </svg>
    </div>
    <script>
      // Disable right-click context menu
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });

      // Disable keyboard shortcuts that could trigger zoom or selection
      document.addEventListener('keydown', function (e) {
        // Prevent Ctrl/Cmd + A (select all)
        if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
          e.preventDefault();
        }
        // Prevent Ctrl/Cmd + +/- (zoom)
        if (
          (e.ctrlKey || e.metaKey) &&
          (e.key === '+' || e.key === '-' || e.key === '=')
        ) {
          e.preventDefault();
        }
      });

      // Rotation animation driven by requestAnimationFrame.
      // Speed grows linearly: 0 deg/frame at t=0, 360 deg/frame at t=120s.
      // Each frame adds speed(t) = 3 * t degrees to the cumulative angle.
      // At 360 deg/frame the symbol appears stationary, so the cycle resets.
      (function () {
        var CYCLE = 120;
        var container = document.querySelector('.yin-yang-container');
        var angle = 0;
        var start = null;

        function frame(ts) {
          if (start === null) start = ts;
          var t = ((ts - start) / 1000) % CYCLE;
          angle += 3 * t;
          container.style.transform = 'rotate(' + (angle % 360) + 'deg)';
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
