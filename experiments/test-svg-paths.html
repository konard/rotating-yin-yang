<!doctype html>
<html>
  <head>
    <title>SVG Path Test</title>
  </head>
  <body
    style="
      background: gray;
      display: flex;
      gap: 40px;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    "
  >
    <div>
      <h3 style="color: white; text-align: center">Current (buggy)</h3>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="-1 -1 2 2"
        width="300"
        height="300"
      >
        <path
          d="M 0 -1 A 1 1 0 0 0 0 1 A 0.5 0.5 0 0 0 0 0 A 0.5 0.5 0 0 1 0 -1"
          fill="black"
        />
        <path
          d="M 0 -1 A 1 1 0 0 1 0 1 A 0.5 0.5 0 0 1 0 0 A 0.5 0.5 0 0 0 0 -1"
          fill="white"
        />
        <circle cx="0" cy="-0.5" r="0.15" fill="white" />
        <circle cx="0" cy="0.5" r="0.15" fill="black" />
      </svg>
    </div>
    <div>
      <h3 style="color: white; text-align: center">Fixed</h3>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="-1 -1 2 2"
        width="300"
        height="300"
      >
        <path
          d="M 0 -1 A 1 1 0 0 0 0 1 A 0.5 0.5 0 0 1 0 0 A 0.5 0.5 0 0 0 0 -1"
          fill="black"
        />
        <path
          d="M 0 -1 A 1 1 0 0 1 0 1 A 0.5 0.5 0 0 0 0 0 A 0.5 0.5 0 0 1 0 -1"
          fill="white"
        />
        <circle cx="0" cy="-0.5" r="0.15" fill="white" />
        <circle cx="0" cy="0.5" r="0.15" fill="black" />
      </svg>
    </div>
  </body>
</html>
